<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Меню</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="fixed-header">
        <div class="header-top">
            <img src="src/logo.png" alt="Logo" class="logo">
            <h1 class="main-title">МЕНЮ</h1>
            <div class="lang-switch">
                <span class="lang active">RU</span>
                <span class="lang">EN</span>
            </div>
        </div>

        <nav class="categories-nav">
            <a href="#kakao" class="nav-link" data-color="#764C18">КАКАО</a>
            <a href="#taro" class="nav-link" data-color="#924AD6">ТАРО</a>
            <a href="#myata" class="nav-link" data-color="#519672">МЯТА</a>
            <a href="#kofe" class="nav-link" data-color="#A67F5B">КОФЕ</a>
            <a href="#matcha" class="nav-link active" data-color="#3E751D">МАТЧА</a>
        </nav>
    </header>

    <main class="content">
        <section id="matcha" class="category-section">
            <h2 class="category-title" style="color: #3E751D;">МАТЧА</h2>

            <div class="carousel-container">
                <button class="carousel-btn prev-btn" aria-label="Назад">&#10092;</button>

                <div class="carousel-slides">
                    
                    <!-- Слайд 1 -->
                    <div class="drink-card active">
                        <img src="src/matcha_latte_bg.png" alt="" class="card-bg">
                        
                        <div class="ingredients-container">
                            <img src="src/ice_cube.png" alt="Ингредиент 1" id="ing-matcha_latte-1" class="ingredient">
                            <img src="src/milk_bottle.png" alt="Ингредиент 2" id="ing-matcha_latte-2" class="ingredient">
                            <img src="src/matcha_pouder.png" alt="Ингредиент 3" id="ing-matcha_latte-3" class="ingredient">
                        </div>

                        <img src="src/matcha_latte.png" alt="Матча Латте" class="drink-image">

                        <div class="drink-info">
                            <h3 class="drink-name">МАТЧА ЛАТТЕ</h3>
                            <p class="drink-price">24-30K</p>
                        </div>
                    </div>

                    <!-- Слайд 2 -->
                    <div class="drink-card">
                        <img src="src/matcha_salted_bg.png" alt="" class="card-bg">

                        <div class="ingredients-container">
                            <img src="src/ice_cube.png" alt="Ингредиент 1" id="ing-matcha_salted-1" class="ingredient">
                            <img src="src/milk_bottle.png" alt="Ингредиент 2" id="ing-matcha_salted-2" class="ingredient">
                            <img src="src/matcha_pouder.png" alt="Ингредиент 3" id="ing-matcha_salted-3" class="ingredient">
                            <img src="src/salted_hat.png" alt="Ингредиент 4" id="ing-matcha_salted-4" class="ingredient">
                        </div>

                        <img src="src/matcha_salted.png" alt="Матча с соленым кремом" class="drink-image">

                        <div class="drink-info">
                            <h3 class="drink-name">МАТЧА С СОЛЕНЫМ КРЕМОМ</h3>
                            <p class="drink-price">28K</p>
                        </div>
                    </div>

                    <!-- Слайд 3 -->
                    <div class="drink-card">
                        <img src="src/matcha_egg_bg.png" alt="" class="card-bg">

                        <div class="ingredients-container">
                            <img src="src/ice_cube.png" alt="Ингредиент 1" id="ing-matcha_egg-1" class="ingredient">
                            <img src="src/milk_bottle.png" alt="Ингредиент 2" id="ing-matcha_egg-2" class="ingredient">
                            <img src="src/matcha_pouder.png" alt="Ингредиент 3" id="ing-matcha_egg-3" class="ingredient">
                        </div>

                        <img src="src/matcha_egg.png" alt="МАТЧА С ЯИЧНЫМ КРЕМОМ" class="drink-image">

                        <div class="drink-info">
                            <h3 class="drink-name">Матча с яичным кремом</h3>
                            <p class="drink-price">30K</p>
                        </div>
                    </div>
                    <!-- Слайд 4  -->
                    <div class="drink-card">
                        <img src="src/matcha_nestle_bg.png" alt="" class="card-bg">
                        
                        <div class="ingredients-container">
                            <img src="src/ice_cube.png" alt="Ингредиент 1" id="ing-matcha_egg-1" class="ingredient">
                            <img src="src/milk_nestle.png" alt="Ингредиент 2" id="ing-matcha_egg-2" class="ingredient">
                            <img src="src/matcha_pouder.png" alt="Ингредиент 3" id="ing-matcha_egg-3" class="ingredient">
                        </div>

                        <img src="src/matcha_nestle.png" alt="МАТЧА С МОЛОКОМ НЕСТЛЕ" class="drink-image">

                        <div class="drink-info">
                            <h3 class="drink-name">МАТЧА С МОЛОКОМ НЕСТЛЕ</h3>
                            <p class="drink-price">30K</p>
                        </div>
                    </div>
                </div>

                <button class="carousel-btn next-btn" aria-label="Вперед">&#10093;</button>
            </div>
            
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
